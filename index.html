<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Lane Traffic School — Florida Driver Improvement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#0d1b2a; --navy2:#132a41; --amber:#ffb703; --amber2:#fb8500;
    --green:#2a9d3f; --green2:#1e7a2e; --red:#e63946; --ink:#1b2733;
    --muted:#6b7a8d; --line:#e3e8ef; --bg:#f5f7fa; --white:#fff;
    --radius:14px; --shadow:0 6px 24px rgba(13,27,42,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  a{color:var(--amber2);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:15px;padding:12px 20px;transition:.15s}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--amber);color:var(--navy)}
  .btn-primary:hover:not(:disabled){background:var(--amber2);color:#fff}
  .btn-green{background:var(--green);color:#fff}
  .btn-green:hover:not(:disabled){background:var(--green2)}
  .btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn-outline:hover{border-color:var(--amber2);color:var(--amber2)}
  input,select{font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--amber)}
  label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--ink)}
  .field{margin-bottom:16px}
  .container{max-width:1080px;margin:0 auto;padding:0 20px}

  /* header */
  header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:66px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.3px;color:#fff;cursor:pointer}
  .logo .badge{width:34px;height:34px;background:var(--amber);border-radius:9px;display:grid;place-items:center;color:var(--navy);font-size:20px}
  .navlinks{display:flex;align-items:center;gap:8px}
  .navlinks .who{font-size:13px;color:#9fb3c8;margin-right:6px}

  /* hero */
  .hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:70px 0 80px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,var(--amber) 0 40px,var(--navy) 40px 80px)}
  .hero h1{font-size:44px;line-height:1.1;letter-spacing:-1px;max-width:640px}
  .hero p.sub{font-size:19px;color:#c7d6e6;margin:18px 0 28px;max-width:560px}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap}
  .pill{display:inline-block;background:rgba(255,183,3,.15);color:var(--amber);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:20px}
  .trust{display:flex;gap:26px;margin-top:38px;flex-wrap:wrap}
  .trust div{font-size:13px;color:#9fb3c8}
  .trust b{display:block;font-size:26px;color:#fff}

  section.pad{padding:56px 0}
  h2.sec{font-size:30px;letter-spacing:-.5px;margin-bottom:8px}
  .sec-sub{color:var(--muted);margin-bottom:32px;font-size:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .card .ic{font-size:30px;margin-bottom:12px}
  .card h3{font-size:18px;margin-bottom:8px}
  .card p{color:var(--muted);font-size:14px}

  .price-wrap{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
  .price{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:30px;width:300px;text-align:center;box-shadow:var(--shadow)}
  .price.feat{border-color:var(--amber)}
  .price .tag{font-size:13px;font-weight:700;color:var(--amber2);text-transform:uppercase;letter-spacing:.5px}
  .price .amt{font-size:46px;font-weight:800;margin:8px 0}
  .price .amt span{font-size:16px;color:var(--muted);font-weight:600}
  .price ul{list-style:none;text-align:left;margin:18px 0}
  .price li{padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
  .price li::before{content:"✓ ";color:var(--green);font-weight:800}

  footer{background:var(--navy);color:#9fb3c8;padding:36px 0;font-size:13px;text-align:center}
  footer a{color:var(--amber)}

  /* app views */
  .view{min-height:calc(100vh - 66px)}
  .auth-wrap{max-width:440px;margin:50px auto;padding:0 20px}
  .auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:34px;box-shadow:var(--shadow)}
  .auth-card h2{font-size:26px;margin-bottom:6px}
  .auth-card .switch{text-align:center;margin-top:18px;font-size:14px;color:var(--muted)}
  .tabbar{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:24px}
  .tabbar button{flex:1;background:transparent;color:var(--muted);padding:10px}
  .tabbar button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

  /* dashboard */
  .dash{display:grid;grid-template-columns:280px 1fr;gap:26px;padding:30px 0}
  .side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;height:fit-content;position:sticky;top:90px}
  .prog-ring{position:relative;width:120px;height:120px;margin:0 auto 14px}
  .prog-num{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
  .mod-nav{list-style:none}
  .mod-nav li{padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .mod-nav li:hover{background:var(--bg)}
  .mod-nav li.active{background:var(--navy);color:#fff}
  .mod-nav li.done .dot{background:var(--green)}
  .mod-nav li.locked{opacity:.5;cursor:not-allowed}
  .dot{width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;flex-shrink:0;color:#fff;font-weight:700}
  .main-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:34px;box-shadow:var(--shadow);min-height:500px}
  .lesson h1{font-size:28px;margin-bottom:6px;letter-spacing:-.5px}
  .lesson .meta{color:var(--muted);font-size:13px;margin-bottom:22px;display:flex;gap:16px;flex-wrap:wrap}
  .lesson-body{font-size:16px}
  .lesson-body h3{margin:22px 0 8px;font-size:19px}
  .lesson-body p{margin-bottom:14px}
  .lesson-body ul{margin:0 0 14px 22px}
  .lesson-body li{margin-bottom:6px}
  .callout{background:#fff8e6;border-left:4px solid var(--amber);padding:14px 18px;border-radius:8px;margin:18px 0;font-size:15px}
  .lesson-foot{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
  .timer-note{font-size:13px;color:var(--muted)}
  .timer-note b{color:var(--ink)}

  /* quiz */
  .quiz h1{font-size:26px;margin-bottom:20px}
  .q{margin-bottom:22px;padding:20px;border:1px solid var(--line);border-radius:12px}
  .q .qtext{font-weight:700;margin-bottom:12px}
  .opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .opt:hover{border-color:var(--amber)}
  .opt.sel{border-color:var(--amber);background:#fff8e6}
  .opt.correct{border-color:var(--green);background:#e9f7ec}
  .opt.wrong{border-color:var(--red);background:#fdeaec}
  .opt input{width:auto}
  .quiz-result{text-align:center;padding:30px}
  .quiz-result .score{font-size:56px;font-weight:800}
  .pass{color:var(--green)} .fail{color:var(--red)}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
  .stat .n{font-size:30px;font-weight:800}
  .stat .l{font-size:13px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  th,td{text-align:left;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line)}
  th{background:var(--navy);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tr:last-child td{border-bottom:none}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
  .chip.g{background:#e9f7ec;color:var(--green2)} .chip.a{background:#fff8e6;color:var(--amber2)} .chip.r{background:#fdeaec;color:var(--red)}

  .modal-bg{position:fixed;inset:0;background:rgba(13,27,42,.6);display:grid;place-items:center;z-index:100;padding:20px}
  .modal{background:#fff;border-radius:var(--radius);padding:32px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{font-size:24px;margin-bottom:6px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:10px;z-index:200;font-weight:600;box-shadow:var(--shadow)}
  .banner{background:#fff8e6;border:1px solid var(--amber);border-radius:12px;padding:16px 20px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .cert-done{text-align:center;padding:40px 20px}
  .cert-done .big{font-size:64px}
  .hide{display:none!important}
  @media(max-width:820px){
    .dash{grid-template-columns:1fr}.side{position:static}
    .grid3{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr 1fr}
    .hero h1{font-size:32px}.row2{grid-template-columns:1fr}
  }
</style>
</head>

        <p>Welcome to your Florida Basic Driver Improvement course. This course is designed to refresh your knowledge of safe driving practices and Florida traffic law. Completing it can satisfy a court requirement, remove points from a citation, or lower your insurance costs.</p>
        <h3>Points, Penalties & Why This Matters</h3>
        <p>Florida assigns points to your license for moving violations. Accumulate too many and your license can be suspended: 12 points in 12 months = 30-day suspension; 18 points in 18 months = 3-month suspension; 24 points in 36 months = 1-year suspension.</p>
        <ul>
          <li>Speeding (up to 15 mph over): 3 points</li>
          <li>Speeding (16+ mph over): 4 points</li>

        <h3>Right-of-Way Basics</h3>

        <p>Most crashes are preventable. The single most effective habit is maintaining space around your vehicle. Use the <b>3-second following rule</b>: pick a fixed point, and when the car ahead passes it, you should not reach it before counting three seconds. Double it to 4–6 seconds in rain, fog, or at night.</p>

/* ---------- Data layer ---------- */
function load(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
  if(!d){ d = { users:[], session:null, settings:{ enforceStateTime:false } }; save(d); }
  if(!d.settings) d.settings = { enforceStateTime:false };
  return d;
}
function save(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
let DB = load();

function currentUser(){ return DB.users.find(u=>u.email===DB.session) || null; }
function persist(){ save(DB); }

function newEnrollment(){
  return {
    paid:false, amount:0, paidAt:null, payMethod:null,
    classType:"home", // "home" (at-home online) or "office" (in-person class)
    modules:{}, // id -> {lessonSec, quizPassed, quizScore}
    finalScore:null, finalPassed:false,
    completedAt:null, certNo:null
  };
}

/* ---------- Router ---------- */
let route = "home";
let ctx = {};
function go(r, c={}){ route=r; ctx=c; render(); window.scrollTo(0,0); }

/* ---------- Helpers ---------- */
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return "$"+n.toFixed(2); }
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function fmtDate(ts){ return new Date(ts).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
function courseProgress(u){
  const e=u.enroll; let done=0;
  COURSE.modules.forEach(m=>{ if(e.modules[m.id]&&e.modules[m.id].quizPassed) done++; });
  const total=COURSE.modules.length+1; // +final
  if(e.finalPassed) done++;
  return Math.round((done/total)*100);
}
function totalMinutes(u){
  let s=0; Object.values(u.enroll.modules).forEach(m=> s+=(m.lessonSec||0));
  return Math.floor(s/60);
}

let activeModuleIdx = 0;

function dashboardView(){
  const u=currentUser();
  if(!u) return authView();
  if(!u.enroll.paid) return paywallView(u);

  const prog=courseProgress(u);
  const m=COURSE.modules[activeModuleIdx];
  const allModsDone = COURSE.modules.every(x=>u.enroll.modules[x.id]&&u.enroll.modules[x.id].quizPassed);

  // side nav
  const navItems = COURSE.modules.map((mm,i)=>{
    const st=u.enroll.modules[mm.id]||{};
    const done=st.quizPassed;
    const locked = i>0 && !(u.enroll.modules[COURSE.modules[i-1].id]||{}).quizPassed;
    return `<li class="${i===activeModuleIdx?'active':''} ${done?'done':''} ${locked?'locked':''}" ${locked?'':`data-mod="${i}"`}>
      <span class="dot">${done?'✓':(i+1)}</span> ${esc(mm.title)}
    </li>`;
  }).join("");
  const finalLocked = !allModsDone;
  const finalDone = u.enroll.finalPassed;

  return `<div class="view"><div class="container"><div class="dash">
    <div class="side">
      <div class="prog-ring">${ring(prog)}<div class="prog-num">${prog}%</div></div>
      <div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:16px">Course progress</div>

function lessonHTML(u,m){
  const st=u.enroll.modules[m.id]||{};
  return `<div class="lesson">
    <h1>${esc(m.title)}</h1>
    <div class="meta"><span>Module ${activeModuleIdx+1} of ${COURSE.modules.length}</span><span>•</span><span>${st.quizPassed?'✓ Completed':'In progress'}</span></div>
    <div class="lesson-body">${m.body}</div>
    <div class="lesson-foot">
      <div class="timer-note" id="timernote">Please review this module. <b><span id="mtimer">0:00</span></b> spent.</div>
      <button class="btn-primary" id="toquiz" ${st.quizPassed?'':'disabled'}>${st.quizPassed?'Review passed ✓ — Continue':'Continue to quiz'}</button>
    </div>
  </div>`;
}

function startLessonTimer(m){
  const u=currentUser();
  if(!u.enroll.modules[m.id]) u.enroll.modules[m.id]=newEnrollment().modules; // guard
  if(!u.enroll.modules[m.id]||typeof u.enroll.modules[m.id]!=='object'||Array.isArray(u.enroll.modules[m.id]))
    u.enroll.modules[m.id]={lessonSec:0,quizPassed:false,quizScore:null};
  const st=u.enroll.modules[m.id];
  const need = (DB.settings.enforceStateTime ? m.minMinutes*60 : 3); // demo: 3s gate; production: minMinutes
  if(lessonTimer) clearInterval(lessonTimer);
  lessonTimer=setInterval(()=>{
    st.lessonSec=(st.lessonSec||0)+1; persist();
    const el=document.getElementById("mtimer");
    if(el){ const s=st.lessonSec; el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,'0'); }
    const btn=document.getElementById("toquiz");
    if(btn && !st.quizPassed){
      if(st.lessonSec>=need){ btn.disabled=false; }
      const note=document.getElementById("timernote");
      if(note && st.lessonSec<need) note.innerHTML=`Please keep reading — quiz unlocks in <b>${need-st.lessonSec}s</b>.`;
      else if(note && !st.quizPassed) note.innerHTML=`<b>✓ Minimum time met.</b> You may take the quiz.`;
    }
  },1000);
}

      <div class="stat"><div class="n">${paid.length}</div><div class="l">Paid enrollments</div></div>
      <div class="stat"><div class="n">${done.length}</div><div class="l">Completed</div></div>

        <div class="field"><label>Email</label><input id="wi_email" type="email" placeholder="student@email.com"></div>
        <div class="field"><label>License # (optional)</label><input id="wi_dl" placeholder="D123-456-78-901-0"></div>

/* ---------- SVG progress ring ---------- */
function ring(pct){
  const r=52,c=2*Math.PI*r,off=c-(pct/100)*c;
  return `<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#e3e8ef" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#2a9d3f" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 60 60)"/>
  </svg>`;
}

/* =========================================================
   EVENT BINDING
   ========================================================= */
function bind(){
  // nav go
  document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{
    const t=el.getAttribute("data-tab"); go(el.getAttribute("data-go"), t?{tab:t}:{});
  });
  document.querySelectorAll("[data-atab]").forEach(el=>el.onclick=()=>{ authTab=el.getAttribute("data-atab"); render(); });
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>handle(el.getAttribute("data-act")));

  // module nav
  document.querySelectorAll("[data-mod]").forEach(el=>el.onclick=()=>{
    activeModuleIdx=parseInt(el.getAttribute("data-mod")); go("dashboard");
  });
  document.querySelectorAll("[data-final]").forEach(el=>el.onclick=()=>go("final"));

  // quiz option highlighting
  document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    const [qi]=el.getAttribute("data-opt").split("-");
    document.querySelectorAll(`.opt[data-opt^="${qi}-"]`).forEach(o=>o.classList.remove("sel"));
    el.classList.add("sel");
    el.querySelector("input").checked=true;
    quizAnswers[qi]=parseInt(el.querySelector("input").value);
  });

  // continue-to-quiz
  const tq=document.getElementById("toquiz");
  if(tq) tq.onclick=()=>{ if(lessonTimer)clearInterval(lessonTimer); go("quiz"); };
  const back=document.querySelector("[data-back]");
  if(back) back.onclick=()=>go("dashboard");

  // admin toggle
  const et=document.getElementById("enforceTime");
  if(et) et.onchange=()=>{ DB.settings.enforceStateTime=et.checked; persist(); toast(et.checked?"Full state timing enabled":"Demo pacing enabled"); };

  // start lesson timer when on dashboard lesson
  if(route==="dashboard"){
    const u=currentUser();
    if(u&&u.enroll.paid){ startLessonTimer(COURSE.modules[activeModuleIdx]); }
  } else { if(lessonTimer) clearInterval(lessonTimer); }
}

/* ---------- Actions ---------- */
function handle(act){
  const u=currentUser();
  if(act==="logout"){ DB.session=null; persist(); go("home"); return; }

  if(act==="signup"){
    const name=val("su_name"),email=val("su_email").toLowerCase(),pass=val("su_pass");
    const dl=val("su_dl"),dob=val("su_dob");
    if(!name||!email||!pass){ toast("Please fill in name, email, and password."); return; }
    if(DB.users.some(x=>x.email===email)){ toast("That email is already enrolled — try logging in."); return; }
    const en=newEnrollment(); en.classType=val("su_type")||"home";
    const user={name,email,pass,dl,dob,enroll:en,createdAt:Date.now()};
    DB.users.push(user); DB.session=email; persist();
    activeModuleIdx=0; go("dashboard"); toast("Account created! Complete checkout to begin.");
    return;
  }
  if(act==="login"){
    const email=val("li_email").toLowerCase(),pass=val("li_pass");
    const user=DB.users.find(x=>x.email===email&&x.pass===pass);
    if(!user){ toast("Incorrect email or password."); return; }
    DB.session=email; persist();
    // resume: land on first incomplete module
    let idx=COURSE.modules.findIndex(m=>!(user.enroll.modules[m.id]||{}).quizPassed);
    activeModuleIdx = idx<0?COURSE.modules.length-1:idx;
    go("dashboard");
    if(user.enroll.paid && idx>0) toast("Welcome back — resuming where you left off.");
    return;
  }
  if(act==="showCard"){
    const box=document.getElementById("cardbox"); if(box){ box.classList.remove("hide"); }
    bind(); return;
  }
  if(act==="pay"){
    const card=val("pay_card").replace(/\s/g,"");
    if(card.length<12){ toast("Enter a valid card number (demo: 4242 4242 4242 4242)."); return; }
    u.enroll.paid=true; u.enroll.amount=COURSE.price; u.enroll.paidAt=Date.now(); u.enroll.payMethod="card";
    persist(); activeModuleIdx=0; go("dashboard"); toast("Payment successful — course unlocked!");
    return;
  }
  if(act==="enrollWalkin"){
    const name=val("wi_name"), email=val("wi_email").toLowerCase(), dl=val("wi_dl");
    if(!name||!email){ toast("Enter the student's name and email."); return; }
    if(DB.users.some(x=>x.email===email)){ toast("That email already exists."); return; }
    const en=newEnrollment(); en.classType="office"; en.paid=true; en.amount=COURSE.price; en.paidAt=Date.now(); en.payMethod="front-desk";
    const tempPass=(val("wi_pass")||"class"+Math.floor(Math.random()*9000+1000));
    DB.users.push({name,email,pass:tempPass,dl,dob:"",enroll:en,createdAt:Date.now()});
    persist(); go("admin"); toast(`${name} enrolled & marked paid. Temp password: ${tempPass}`);
    return;
  }
  if(act && act.startsWith("markpaid:")){
    const email=act.split(":")[1]; const s=DB.users.find(x=>x.email===email);
    if(s){ s.enroll.paid=true; s.enroll.amount=COURSE.price; s.enroll.paidAt=Date.now(); s.enroll.payMethod="front-desk"; persist(); go("admin"); toast("Marked paid."); }
    return;
  }
  if(act && act.startsWith("resetpw:")){
    const email=act.split(":")[1]; const s=DB.users.find(x=>x.email===email);
    if(s){ const np="fl"+Math.floor(Math.random()*9000+1000); s.pass=np; persist(); toast(`New password for ${s.name}: ${np}`); }
    return;
  }
  if(act==="bulkCreate"){
    const lines=(document.getElementById("bulk").value||"").split("\n").map(l=>l.trim()).filter(Boolean);
    let added=0;
    lines.forEach(l=>{
      const parts=l.split(",").map(p=>p.trim());
      const name=parts[0], email=(parts[1]||"").toLowerCase();
      if(!name||!email||DB.users.some(x=>x.email===email)) return;
      const en=newEnrollment(); en.classType="office"; en.paid=true; en.amount=COURSE.price; en.paidAt=Date.now(); en.payMethod="front-desk";
      DB.users.push({name,email,pass:"fl"+Math.floor(Math.random()*9000+1000),dl:"",dob:"",enroll:en,createdAt:Date.now()});
      added++;
    });
    persist(); go("admin"); toast(added+" account(s) created.");
    return;
  }
  if(act==="exportCsv"){
    const hdr=["Name","Email","Type","License","Progress%","Status","FinalScore","CertNo","TimeMin","Paid$","PayMethod","PaidAt"];
    const rows=DB.users.map(s=>{const e=s.enroll;return [
      s.name,s.email, e.classType==="office"?"In-person":"At home", s.dl||"",
      courseProgress(s), e.finalPassed?"Completed":(e.paid?"In progress":"Unpaid"),
      e.finalScore??"", e.certNo||"", totalMinutes(s), e.paid?e.amount:"", e.payMethod||"",
      e.paidAt?new Date(e.paidAt).toISOString().slice(0,10):""
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")});
    const csv=[hdr.join(","),...rows].join("\n");
    const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="FastLane-roster-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
    URL.revokeObjectURL(url); toast("Roster exported.");
    return;
  }
  if(act==="gradeQuiz"){ gradeQuiz(); return; }
  if(act==="gradeFinal"){ gradeFinal(); return; }
  if(act==="downloadCert"){ makeCertificate(u); return; }

  if(act==="adminLogin"){
    if(val("ad_user")==="admin"&&val("ad_pass")==="admin"){ go("admin"); }
    else toast("Invalid admin credentials (demo: admin / admin).");
    return;
  }
}
function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }

function gradeQuiz(){
  const u=currentUser(); const m=COURSE.modules[activeModuleIdx];
  const total=m.quiz.length; let correct=0;
  if(Object.keys(quizAnswers).length<total){ toast("Please answer every question."); return; }
  m.quiz.forEach((q,i)=>{ if(quizAnswers[i]===q.a) correct++; });
  const score=Math.round((correct/total)*100);
  revealQuiz(m.quiz);
  const passed=score>=COURSE.passScore;
  const st=u.enroll.modules[m.id]||{lessonSec:0}; st.quizScore=score; st.quizPassed=st.quizPassed||passed; u.enroll.modules[m.id]=st; persist();
  showQuizResult(score,passed,()=>{
    if(passed){
      if(activeModuleIdx<COURSE.modules.length-1){ activeModuleIdx++; go("dashboard"); }
      else { go("dashboard"); toast("All modules done! The Final Exam is unlocked."); }
    } else { go("quiz"); }
  });
}
function gradeFinal(){
  const u=currentUser(); const qs=COURSE.finalExam.questions; const total=qs.length; let correct=0;
  if(Object.keys(quizAnswers).length<total){ toast("Please answer every question."); return; }
  qs.forEach((q,i)=>{ if(quizAnswers[i]===q.a) correct++; });
  const score=Math.round((correct/total)*100);
  revealQuiz(qs);
  const passed=score>=COURSE.finalExam.passScore;
  u.enroll.finalScore=score; u.enroll.finalPassed=u.enroll.finalPassed||passed;
  if(passed&&!u.enroll.certNo){
    u.enroll.certNo="FLTS-"+Date.now().toString(36).toUpperCase().slice(-6)+"-"+Math.floor(Math.random()*900+100);
    u.enroll.completedAt=Date.now();
  }
  persist();
  showQuizResult(score,passed,()=>{ if(passed) go("certificate"); else go("final"); });
}
function revealQuiz(qs){
  qs.forEach((q,i)=>{
    document.querySelectorAll(`.opt[data-opt^="${i}-"]`).forEach((o,j)=>{
      o.style.pointerEvents="none";
      if(j===q.a) o.classList.add("correct");
      else if(quizAnswers[i]===j) o.classList.add("wrong");
    });
  });
}
function showQuizResult(score,passed,cont){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" style="text-align:center">
    <div style="font-size:50px">${passed?'✅':'📚'}</div>
    <h2 class="${passed?'pass':'fail'}">${passed?'Passed!':'Not quite'}</h2>
    <div class="score ${passed?'pass':'fail'}" style="font-size:48px;font-weight:800">${score}%</div>
    <p style="color:var(--muted);margin:8px 0 20px">${passed?'Great work — keep going.':'You need '+COURSE.passScore+'% to continue. Review and try again.'}</p>
    <button class="btn-primary" id="contBtn" style="width:100%">${passed?'Continue →':'Try again'}</button>
  </div>`;
  document.body.appendChild(bg);
  document.getElementById("contBtn").onclick=()=>{ bg.remove(); cont(); };
}

/* ---------- Certificate PDF ---------- */
function makeCertificate(u){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"letter"});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  // border
  doc.setDrawColor(13,27,42); doc.setLineWidth(6); doc.rect(24,24,W-48,H-48);
  doc.setDrawColor(255,183,3); doc.setLineWidth(2); doc.rect(36,36,W-72,H-72);
  // header
  doc.setFont("helvetica","bold"); doc.setTextColor(13,27,42); doc.setFontSize(30);
  doc.text(SCHOOL,W/2,90,{align:"center"});
  doc.setFontSize(13); doc.setTextColor(120,120,120); doc.setFont("helvetica","normal");
  doc.text("CERTIFICATE OF COMPLETION",W/2,116,{align:"center"});
  // body
  doc.setFontSize(14); doc.setTextColor(60,60,60);
  doc.text("This certifies that",W/2,165,{align:"center"});
  doc.setFont("helvetica","bold"); doc.setFontSize(32); doc.setTextColor(13,27,42);
  doc.text(u.name,W/2,205,{align:"center"});
  doc.setFont("helvetica","normal"); doc.setFontSize(14); doc.setTextColor(60,60,60);
  doc.text("has successfully completed the",W/2,240,{align:"center"});
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(251,133,0);
  doc.text("Florida Basic Driver Improvement Course (4-Hour BDI)",W/2,268,{align:"center"});
  doc.setFont("helvetica","normal"); doc.setFontSize(12); doc.setTextColor(60,60,60);
  doc.text(`with a final exam score of ${u.enroll.finalScore}%`,W/2,292,{align:"center"});
  // details row
  doc.setFontSize(11); doc.setTextColor(90,90,90);
  const y=350;
  doc.text(`Certificate No: ${u.enroll.certNo}`,90,y);
  doc.text(`Date Completed: ${fmtDate(u.enroll.completedAt)}`,90,y+20);
  doc.text(`Driver License: ${u.dl||"—"}`,90,y+40);
  doc.text(`Provider of Record: ${PROVIDER}`,W-90,y,{align:"right"});
  doc.text(`Reported to: Florida DHSMV`,W-90,y+20,{align:"right"});
  // signature line
  doc.setDrawColor(13,27,42); doc.setLineWidth(1);
  doc.line(W-260,H-90,W-90,H-90);
  doc.setFontSize(10); doc.text("Authorized Signature",W-175,H-74,{align:"center"});
  doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(140,140,140);
  doc.text("This is a demonstration certificate generated by the Fast Lane Traffic School LMS.",W/2,H-50,{align:"center"});
  doc.save(`FastLane-Certificate-${u.enroll.certNo}.pdf`);
  toast("Certificate downloaded.");
}

/* ---------- kiosk idle auto-logout ---------- */
let idleTimer=null;
function resetIdle(){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    if(DB.session && route!=="admin"){
      DB.session=null; persist(); go("home"); toast("Signed out after inactivity (kiosk safety).");
    }
  }, IDLE_LOGOUT_MIN*60*1000);
}
["click","keydown","mousemove","touchstart"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
resetIdle();

/* ---------- boot ---------- */
render();
</script>
